name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RouteKeeper.slnx -c Release
      - run: dotnet run --project tests/RouteKeeper.Core.Tests -c Release --no-build
      - run: dotnet run --project tests/RouteKeeper.Tool.Tests -c Release --no-build
      - run: dotnet run --project tests/RouteKeeper.Saves.Tests -c Release --no-build
      - run: dotnet run --project tests/RouteKeeper.Core.Tests -c Release --no-build -- --verify-gml integration/gml/route_evaluate.gml
      - run: dotnet run --project tests/RouteKeeper.Neutral.Tests -c Release --no-build
      - run: dotnet run --project tests/RouteKeeper.Neutral.Tests -c Release --no-build -- --verify-gml integration/gml
      - run: dotnet run --project tests/RouteKeeper.Decisions.Tests -c Release --no-build
      - run: dotnet run --project tests/RouteKeeper.Decisions.Tests -c Release --no-build -- --verify-adapters integration/gml
      - run: dotnet run --project tests/RouteKeeper.History.Tests -c Release --no-build
      - run: dotnet run --project tests/RouteKeeper.Audit.Tests -c Release --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python integration/ui/generate.py --verify
      - run: python integration/generate_font.py --verify
      - run: python integration/ui/test_ui.py
      - run: python tools/test_runtime_lab.py
      - run: python tools/test_workflow_safety.py
      - name: Verify Windows harness source and filesystem guards only
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/runtime/test-sandbox.ps1
      - name: Verify filesystem protocol under Windows PowerShell 5.1 only
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/runtime/test-current-account.ps1
      - run: dotnet run --project tests/RouteKeeper.Decisions.Tests -c Release --no-build -- --verify-ui integration
      - name: Verify real delta packaging on synthetic data
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xdelta3
          python tools/test-g3m.py --tool src/RouteKeeper.Tool/bin/Release/net10.0/RouteKeeper.Tool.dll --xdelta /usr/bin/xdelta3
      - name: Package standalone tool for this host
        run: dotnet publish src/RouteKeeper.Tool -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/tool
      - uses: actions/upload-artifact@v4
        with:
          name: routekeeper-tool-${{ matrix.rid }}
          path: artifacts/tool/
          retention-days: 7
  authentic-structural:
    if: github.event_name == 'push' && github.event.repository.private == true && github.repository == 'tkgo11/undertale-routekeeper'
    uses: ./.github/workflows/authentic.yml
    permissions:
      contents: write
